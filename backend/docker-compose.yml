services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    # Uncomment only for redis-cli debugging from the Windows host itself;
    # bind loopback-only, never 0.0.0.0, so it stays off the LAN:
    # ports:
    #   - "127.0.0.1:6379:6379"

volumes:
  redis-data:
